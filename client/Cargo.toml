[package]
name = "oftc"
version = "0.1.0"
edition = "2021"
description = "CLI for the OFTC macOS IKEv2 and SAML VPN client"
license = "Apache-2.0 OR MIT"
publish = false

[[bin]]
name = "oftc"
path = "src/main.rs"

[dependencies]
oftc-ui-edge = { path = "../app/core/ui-edge" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

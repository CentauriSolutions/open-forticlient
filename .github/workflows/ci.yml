name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Hosted runners sometimes stall on crate downloads. Retry more and wait longer
# before cargo calls a transfer too slow; scripts/fetch-rust-deps.sh bounds each
# whole fetch attempt.
env:
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  CARGO_HTTP_MULTIPLEXING: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks gate the expensive ones: lint, then Rust tests, then the macOS
  # build with the Swift checks. Each job is its own required check.
  lint:
    name: Rust lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: for f in app/*.sh scripts/*.sh app/package-scripts/*; do zsh -n "$f" 2>/dev/null || bash -n "$f"; done

      - name: Provider version above the activated floor
        run: zsh app/check-versions.sh

      - name: Installer script checks
        run: zsh app/check-package-scripts.sh

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'client/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch locked Rust dependencies
        run: zsh scripts/fetch-rust-deps.sh

      - name: Clippy
        run: zsh scripts/lint-rust.sh

  test:
    name: Rust tests
    needs: lint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'client/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch locked Rust dependencies
        run: zsh scripts/fetch-rust-deps.sh

      - name: Run Rust unit tests
        # pipefail: without it tee's status hides a failing cargo test.
        shell: bash -eo pipefail {0}
        # --include-ignored runs the loopback tests that sandboxed agent
        # environments skip; the runner allows 127.0.0.1 sockets.
        run: zsh scripts/test-rust.sh -- --include-ignored 2>&1 | tee test.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Rust tests"
            grep -E '^test result:' test.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test, unsigned package
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'client/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch locked Rust dependencies
        run: zsh scripts/fetch-rust-deps.sh

      - name: Build and run the Swift checks
        # app/build.sh refuses an existing output directory and only accepts
        # /private/tmp/oftc-build-*. It does not sign, install or connect.
        shell: bash -eo pipefail {0}
        run: |
          echo "OFTC_BUILD_DIR=/private/tmp/oftc-build-ci" >> "$GITHUB_ENV"
          OFTC_BUILD_DIR=/private/tmp/oftc-build-ci zsh app/build.sh 2>&1 | tee build.log

      - name: Swift check summary
        if: always()
        run: |
          {
            echo "### Swift checks"
            grep -E 'checks? passed|synthetic checks passed|isolated commands only' build.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble unsigned package
        run: OFTC_UNSIGNED_PACKAGE=1 zsh app/package.sh

      - name: Name the artifact
        id: name
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$OFTC_BUILD_DIR/OFTC.app/Contents/Info.plist")
          short=$(git rev-parse --short=8 HEAD)
          mkdir -p out
          cp "$OFTC_BUILD_DIR/OFTC-$version-unsigned.pkg" "out/OFTC-$version-$short-unsigned.pkg"
          (cd out && shasum -a 256 *.pkg > SHA256SUMS)
          echo "dir=out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: oftc-unsigned-pkg
          path: out/
          if-no-files-found: error
          retention-days: 14

[package]
name = "oftc-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "oftc_crypto"
path = "src/lib.rs"

[dependencies]
aes = "=0.9.4"
cbc = "=0.2.1"
getrandom = "=0.4.3"
hmac = "=0.13.0"
p384 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh"] }
sha1 = "=0.11.0"
sha2 = "=0.11.1"
zeroize = "=1.9.0"

[lints]
workspace = true

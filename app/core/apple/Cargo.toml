[package]
name = "oftc-apple"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "oftc_apple"
path = "src/lib.rs"

[dependencies]
oftc-engine = { path = "../engine" }
oftc-provider = { path = "../provider" }
zeroize = "=1.9.0"

# The NetworkExtension provider side. Pinned like the repo's other crates;
# the Apple crates compile only on macOS, so the pure modules still build
# everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = { version = "=0.6.5", features = ["exception"] }
objc2-foundation = "=0.3.2"
objc2-network-extension = "=0.3.2"

[lints]
workspace = true

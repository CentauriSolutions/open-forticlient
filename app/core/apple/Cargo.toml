[package]
name = "oftc-apple"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "oftc_apple"
path = "src/lib.rs"

[dependencies]
oftc-engine = { path = "../engine" }
oftc-provider = { path = "../provider" }
zeroize = "=1.9.0"

# Apple frameworks are reached only from macOS builds; everything above builds
# anywhere. Versions are pinned exactly, like the rest of the workspace.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = { version = "=0.6.5", features = ["exception"] }
objc2-foundation = "=0.3.2"
objc2-network-extension = "=0.3.2"

[lints]
workspace = true

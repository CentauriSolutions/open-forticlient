[workspace]
resolver = "2"
members = [
    "core/crypto",
    "core/engine",
    "core/host-bootstrap",
    "core/migration",
    "core/modp14",
    "core/preflight",
    "core/provider-ffi",
]

[profile.release]
opt-level = "z"

# Baseline for the existing code; Issue 50 reviews each allowance.
[workspace.lints.clippy]
# The C ABI contracts are documented in oftc_ffi.h, not in per-function docs.
missing_safety_doc = "allow"
# Handshake and rekey constructors take the full set of IKE inputs.
too_many_arguments = "allow"
